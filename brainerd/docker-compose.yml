version: "3.9"

# ─── Brainerd AI stack ────────────────────────────────────────────────────────
# Services:
#   ollama    — local LLM inference (mistral:7b pre-pulled on startup)
#   brainerd  — AI hub API (REST + WebSocket)
#   db-init   — one-shot model pull helper (exits after pulling)
#
# External containers link to brainerd via the shared "brainerd_net" network:
#
#   networks:
#     brainerd_net:
#       external: true
#
# Then hit http://brainerd:8000 from any container on that network.

networks:
  # Internal network — ollama <-> brainerd
  internal:
    driver: bridge

  # External network — other app containers join this to reach brainerd
  brainerd_net:
    driver: bridge
    name: brainerd_net

volumes:
  ollama_data:     # Ollama model storage (~4 GB for mistral:7b Q4) — disk-heavy is fine
  brainerd_data:   # SQLite database

services:

  # ── Ollama (local LLM inference) ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: brainerd_ollama
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ollama_data:/root/.ollama
    # CPU-only: no GPU flags. Ollama auto-detects; on CPU-only it uses GGUF quantized models.
    environment:
      - OLLAMA_NUM_PARALLEL=1       # one request at a time — low-CPU friendly
      - OLLAMA_MAX_LOADED_MODELS=1  # keep one model in memory, swap from disk as needed
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Model puller (runs once on first boot, pulls mistral:7b) ──────────────
  model-init:
    image: ollama/ollama:latest
    container_name: brainerd_model_init
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - internal
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "
        echo 'Pulling mistral:7b (Q4 quantized, ~4 GB)...' &&
        ollama pull mistral:7b &&
        echo 'Model ready.'
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  # ── Brainerd AI API ───────────────────────────────────────────────────────
  brainerd:
    build:
      context: .
      dockerfile: Dockerfile
    image: brainerd:latest
    container_name: brainerd
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - internal      # talks to ollama
      - brainerd_net  # exposes API to other containers
    ports:
      - "8000:8000"   # host access (remove if only container-to-container)
    volumes:
      - brainerd_data:/data         # SQLite lives here
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DATABASE_URL=sqlite+aiosqlite:////data/brainerd.db
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
