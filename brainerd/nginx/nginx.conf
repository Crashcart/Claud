# Optional nginx reverse proxy config — add to your own nginx container
# if you want TLS termination or a unified entrypoint.
#
# Usage: mount this file into your nginx container and add to docker-compose:
#
#   nginx:
#     image: nginx:alpine
#     networks:
#       - brainerd_net
#     volumes:
#       - ./nginx/nginx.conf:/etc/nginx/conf.d/brainerd.conf

upstream brainerd_api {
    server brainerd:8000;
}

server {
    listen 80;
    server_name _;

    # REST API
    location /api/ {
        proxy_pass         http://brainerd_api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # WebSocket chat
    location /ws/ {
        proxy_pass             http://brainerd_api/chat/ws/;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }
}
